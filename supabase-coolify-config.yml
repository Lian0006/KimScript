# Configuración para desplegar Supabase API en Coolify
# Se conectará al PostgreSQL existente
# IMPORTANTE: Reemplaza ${POSTGRES_HOST} con el nombre real del servicio PostgreSQL en Coolify

version: '3.8'
services:
  # Supabase API (PostgREST)
  supabase-api:
    image: postgrest/postgrest:v12.0.2
    environment:
      PGRST_DB_URI: postgres://postgres:CnTS8aAUI1Ox2T1t5mvCNhuUV6VrU4Kt@${POSTGRES_HOST}:5432/postgres
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_ADMIN_SERVER_PORT: 3001
    ports:
      - "3000:3000"
      - "3001:3001"
    restart: unless-stopped

  # Supabase Auth (GoTrue)
  supabase-auth:
    image: supabase/gotrue:v2.150.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      
      # Database
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:CnTS8aAUI1Ox2T1t5mvCNhuUV6VrU4Kt@${POSTGRES_HOST}:5432/postgres
      
      # JWT
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      
      # Site
      GOTRUE_SITE_URL: https://www.kimscript.com
      GOTRUE_URI_ALLOW_LIST: https://www.kimscript.com,https://kimscript.com
      
      # Email
      GOTRUE_DISABLE_SIGNUP: false
      GOTRUE_MAILER_AUTOCONFIRM: false
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: true
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      
      # SMTP - Usesend
      GOTRUE_SMTP_HOST: smtp.usesend.com
      GOTRUE_SMTP_PORT: 587
      GOTRUE_SMTP_USER: usesend
      GOTRUE_SMTP_PASS: us_lsa7f5ajbm_e13575da88ba7f6feb1d6d939b14c1d4
      GOTRUE_SMTP_ADMIN_EMAIL: support@kimscript.com
      GOTRUE_SMTP_SENDER_NAME: KimScript
      
    ports:
      - "9999:9999"
    restart: unless-stopped

  # Supabase Studio (Dashboard)
  supabase-studio:
    image: supabase/studio:20240326-5e5586d
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: CnTS8aAUI1Ox2T1t5mvCNhuUV6VrU4Kt
      
      SUPABASE_URL: https://bd.kimscript.com
      SUPABASE_REST_URL: https://bd.kimscript.com/rest/v1/
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    ports:
      - "3001:3000"
    restart: unless-stopped

  # Meta API para Studio
  supabase-meta:
    image: supabase/postgres-meta:v0.83.2
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: CnTS8aAUI1Ox2T1t5mvCNhuUV6VrU4Kt
    ports:
      - "8080:8080"
    restart: unless-stopped